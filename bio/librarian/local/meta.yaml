name: librarian local
url: https://kartva.github.io/Librarian/usage/
description: |
  A tool to predict the sequencing library type from the base composition of a supplied
  FastQ file.
authors:
  - Thibault Dayris
input:
  - reads: Path to fastq file used to caracterise the library
  - librarian_directory: Path to installation directory
output:
  - composition_map_png: Optional path to PNG formatted composition map
  - composition_map_svg: Optional path to SVG formatted composition map
  - probability_maps_png: Optional path to PNG formatted probability maps
  - probability_maps_svg: Optional path to SVG formatted probability maps
  - prediction_plot_png: Optional path to PNG formatted prediction plot
  - prediction_plot_svg: Optional path to SVG formatted prediction plot
  - heatmap_png: Optional path to composition heatmap
  - heatmap_txt: Path to composition heatmap in text format
  - report: Optional path to HTML report
params:
  - extra: Optional parameters besies IO and threading 
