name: fastq_utils bam_annotate
url: https://github.com/nunofonseca/fastq_utils#bam_annotatesh---annotate-alignments-with-gxtx-tags
description: |
  Given a BAM file annotates the alignments with the features defined in the bed files 
  (genes->GX tag, transcritps->TX tag). Alignments can also be annotated as exonic or 
  intronic if they overlap the regions defined in the exon or intron bed file 
  respectively.
author:
  - Thibault Dayris
input:
  - aln: Path to BAM file
  - genes: Optional path to gene BED file
  - transcripts: Optional path to transcripts BED file
  - exon: Optional path to exon coordinates (BED)
  - introns: Optional path to introns coordinates (BED)
output:
  - Path to annotated bam
notes: |
  No optional parameter expected. Everything is automatically detected.
