name: fastvep
description: Build custom databased for High-performance Variant Effect Predictor in Rust
url: https://github.com/Huang-lab/fastVEP
author:
  - Thibault Dayris
input:
  - Path to an indexed vcf/vcf.gz file
output:
  - Either a pair of .osa and .osa.idx, or .osa2 and .osa2.idx, or .osi
params:
  - extra: Optional parameters besides `--input`, `--output`, or `--format`.
notes: |
  Latest version of databases should always be preferred (osa2 is better than osa).
  User can convert osa to osa2 with `fastvep sa-convert`.
